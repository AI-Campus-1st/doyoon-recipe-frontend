# frontend 컨테이너의 nginx 설정
# - /api/* → backend 컨테이너(Express :3000). 개발 서버(vite.config.js)의 /api 프록시와 같은 역할
# - 그 밖의 화면 경로(/recipes/12 등)는 index.html 을 돌려줘 새로고침해도 React Router가 화면을 그린다(SPA fallback)
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 빌드 파일(이름에 해시 포함)은 오래 캐시
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        # index.html 은 캐시하지 않아 새 배포가 바로 보이게 한다
        add_header Cache-Control "no-cache";
    }
}
